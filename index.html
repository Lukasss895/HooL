<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>HooL</title>
    <style>
        body {
            background-color: #1b1b1b;
            color: #b5b5b5;
            font-family: Arial, Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 80px;
        }
        .container {
            width: 450px;
            margin: 0 auto;
            background-color: #2b2b2b;
            border: 1px solid #101010;
            padding: 40px;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }
        h1 {
            color: #ffffff;
            font-size: 26px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        p {
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(to bottom, #5a5a5a, #333333);
            color: white;
            padding: 10px 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid #1a1a1a;
            border-radius: 2px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .btn:hover {
            background: linear-gradient(to bottom, #6a6a6a, #3d3d3d);
        }
        footer {
            margin-top: 40px;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HOOL</h1>
        <div class="subtitle">Hooligans Corporation</div>
        
        <p>Retro herný klient inšpirovaný zlatou érou roku 2010. Žiadne zbytočnosti, len čistá nostalgická atmosféra pre tvoje hry.</p>
        
        <a href="#" class="btn">Stiahnuť HooL (v1.0)</a>
        
        <footer>
            &copy; 2010-2026 Hooligans Corporation. Všetky práva vyhradené.
        </footer>
    </div>

</body>
</html>
